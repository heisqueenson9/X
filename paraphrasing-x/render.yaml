services:
  - type: web
    name: paraphrasing-x
    env: node
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: npm run start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: HUGGINGFACE_API_KEY
        sync: false
      - key: ADMIN_SECRET_KEY
        sync: false
    disk:
      name: uploads-disk
      # Mount point points to Next.js public/uploads safely
      mountPath: /opt/render/project/src/public/uploads
      sizeGB: 1
